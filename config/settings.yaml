# Territory Control and Hotspot Analysis Using Geospatial Big Data
# Day 1 Configuration Settings

project:
  name: "Real-Time Territory Control and Hotspot Analysis Using Geospatial Big Data"
  version: "0.1.0"
  phase: "Day 1 - Foundation & Ingestion"

spark:
  app_name: "TerritoryControlHotspotAnalysis"
  master: "local[2]"
  driver_memory: "2g"
  shuffle_partitions: 4
  log_level: "WARN"
  sql:
    adaptive:
      enabled: false

geospatial:
  center_lat: 41.8781
  center_lon: -87.6298
  radius_m: 5000.0
  h3_resolution: 9

generator:
  default_records: 1000
  default_runners: 25
  default_seed: 42
  sampling_interval_min_s: 3
  sampling_interval_max_s: 10
  base_elevation_m: 181.0
  scenarios:
    normal_run:
      weight: 0.55
      speed_min_kmh: 5.0
      speed_max_kmh: 12.0
      hr_min: 130
      hr_max: 165
      cadence_min: 155
      cadence_max: 175
    fast_run:
      weight: 0.10
      speed_min_kmh: 10.0
      speed_max_kmh: 20.0
      hr_min: 155
      hr_max: 188
      cadence_min: 168
      cadence_max: 192
    walking:
      weight: 0.10
      speed_min_kmh: 3.0
      speed_max_kmh: 6.0
      hr_min: 85
      hr_max: 115
      cadence_min: 100
      cadence_max: 125
    driving:
      weight: 0.10
      speed_min_kmh: 30.0
      speed_max_kmh: 80.0
      hr_min: 65
      hr_max: 95
      cadence_min: 0
      cadence_max: 40
    gps_spoofing:
      weight: 0.10
      speed_min_kmh: 5.0
      speed_max_kmh: 12.0
      hr_min: 130
      hr_max: 165
      cadence_min: 155
      cadence_max: 175
    gps_noise:
      weight: 0.05
      speed_min_kmh: 5.0
      speed_max_kmh: 12.0
      hr_min: 130
      hr_max: 165
      cadence_min: 155
      cadence_max: 175
  device_types:
    - "Garmin Forerunner 965"
    - "Apple Watch Ultra 2"
    - "Coros Pace 3"
    - "Polar Vantage V3"
    - "Suunto Race"

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  parquet_dir: "data/parquet"
  reports_dir: "data/reports"

day2:
  ingestion:
    default_input: "data/raw/gps_100k.csv"
  cleaning:
    min_latitude: -90.0
    max_latitude: 90.0
    min_longitude: -180.0
    max_longitude: 180.0
    min_time_diff_s: 0.0
    max_time_diff_s: 3600.0
  cheat_detection:
    max_running_speed_kmh: 25.0
    teleport_jump_m: 300.0
    teleport_speed_kmh: 80.0
    driving_speed_kmh: 25.0
    driving_min_consecutive_points: 3
    driving_max_cadence: 50
    abnormal_accel_mps2: 8.0
    noise_spike_dist_m: 50.0
    noise_return_dist_m: 30.0
    risk_thresholds:
      normal_max: 0.29
      suspicious_max: 0.59
      high_risk_min: 0.60
    weights:
      teleport: 0.40
      driving: 0.35
      impossible_speed: 0.25
      abnormal_accel: 0.15
      noise: 0.10
  territory:
    h3_resolution: 9
    min_consecutive_observations: 2

